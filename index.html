<title>How Do You Feel Today</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Josefin+Sans:wght@600;700&family=DM+Mono:wght@400&display=swap">
<style>
  /* Layout: a flat Bauhaus poster ground (primary shapes + one heavy bar) with the phone set dead centre. */
  :root {
    --ground: #e7e4dc;
    --ink: #141414;
    --red: #c8322a;
    --yellow: #e6b325;
    --blue: #1d4f91;
    --muted: #5b5852;
    --screen: #000000;
    --screen-ink: #f2efe8;
    --bezel: #141414;
    --bezel-edge: #141414;
    --font-display: "Jost", "Futura", "Century Gothic", "Avenir Next", sans-serif;
    --font-title: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #1a1917; --ink: #e9e6df; --red: #d8443a; --yellow: #edbd33;
      --blue: #3567ad; --muted: #9b978f; --bezel: #0b0b0b; --bezel-edge: #3a3833;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1a1917; --ink: #e9e6df; --red: #d8443a; --yellow: #edbd33;
    --blue: #3567ad; --muted: #9b978f; --bezel: #0b0b0b; --bezel-edge: #3a3833;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    justify-items: center;
    gap: 20px;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    isolation: isolate;
  }

  /* Poster geometry */
  .shape { position: absolute; z-index: -1; }
  .shape.circle {
    width: 46vmin; height: 46vmin; border-radius: 50%;
    background: var(--red);
    left: calc(50% - 46vmin - 9vmin); top: 9vh;
  }
  .shape.bar {
    height: 2.4vmin; left: 0; width: 58%;
    top: 63%; background: var(--ink);
  }
  .shape.square {
    width: 22vmin; height: 22vmin; background: var(--yellow);
    left: calc(50% + 17vmin); bottom: 30vh;
  }
  .shape.half {
    width: 30vmin; height: 15vmin; background: var(--blue);
    border-radius: 15vmin 15vmin 0 0;
    left: calc(50% + 24vmin); top: 12vh;
  }

  .caption {
    position: absolute;
    left: max(32px, env(safe-area-inset-left, 0px));
    top: 32px;
    display: grid; gap: 6px;
    max-width: 40ch;
  }
  .caption h2 {
    margin: 0; font-weight: 700; font-size: 15px;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .caption p {
    margin: 0; font-family: var(--font-mono); font-size: 12px;
    color: var(--muted); line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  .caption .choice { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .caption .choice i { width: 12px; height: 12px; background: var(--chosen, transparent); box-shadow: 0 0 0 1px var(--ink); }

  /* Phone */
  .phone-slot {
    min-height: 0; height: 100%; width: 100%;
    display: grid; place-items: center;
  }
  .phone {
    position: relative;
    height: 100%;
    max-height: 844px;
    aspect-ratio: 390 / 844;
    max-width: 100%;
    padding: 10px;
    background: var(--bezel);
    border-radius: 44px;
    box-shadow: 0 0 0 1px var(--bezel-edge);
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: var(--screen);
    color: var(--screen-ink);
    container-type: size;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
  }
  .screen:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }
  .screen.locked { cursor: default; }
  .screen canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .header {
    position: absolute;
    left: 9cqw; top: 9cqh; right: 9cqw;
    display: grid; justify-items: start; gap: 5cqw;
    pointer-events: none;
  }
  .question {
    margin: 0;
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 11.5cqw;
    line-height: 1.02;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .question::before {
    content: "";
    display: block;
    width: 4.2cqw; height: 4.2cqw;
    background: var(--red);
    margin-bottom: 4cqw;
  }
  .rule {
    width: 18cqw; height: 0.8cqw;
    background: var(--screen-ink);
  }

  .timer {
    position: absolute;
    left: 50%; bottom: 6.5cqh;
    transform: translateX(-50%);
    display: grid; justify-items: center; gap: 2.6cqw;
  }
  .timer svg { width: 15cqw; height: 15cqw; overflow: visible; }
  .timer .track { fill: none; stroke: var(--screen-ink); stroke-opacity: 0.28; stroke-width: 1.5; }
  .timer .tick { stroke: var(--screen-ink); stroke-opacity: 0.55; stroke-width: 1.5; }
  .timer svg { transition: transform 0.18s ease-out; }
  .timer .fill { opacity: 0; transition: opacity 0.25s ease-out; }
  .timer.pressing svg { transform: scale(0.9); }
  .timer.pressing .fill { opacity: var(--fill-strength, 0.6); }
  .timer.chosen .fill { opacity: calc(var(--fill-strength, 0.6) * 0.7); transition-duration: 0.6s; }
  .timer .arc {
    fill: none; stroke: var(--arc, var(--screen-ink)); stroke-width: 3;
    stroke-dasharray: 150.8; stroke-dashoffset: 150.8;
    transform: rotate(-90deg);
  }
  .timer .loop-num {
    fill: var(--screen-ink); opacity: 0.8;
    font-family: var(--font-mono); font-size: 11px;
    text-anchor: middle; dominant-baseline: central;
  }
  .timer.locked svg { animation: lock-pulse 0.9s ease-out 1; }
  @keyframes lock-pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .timer .again {
    font-family: var(--font-mono); font-size: 2.9cqw;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--screen-ink); background: transparent;
    border: 1px solid var(--screen-ink); border-radius: 0;
    padding: 1.6cqw 3.2cqw; cursor: pointer;
  }
  .timer .again:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  .timer .hint {
    font-family: var(--font-mono);
    font-size: 2.9cqw;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  .fallback {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 0 12cqw; text-align: center;
    font-family: var(--font-mono); font-size: 3.2cqw; line-height: 1.6;
    color: var(--screen-ink); opacity: 0.7;
  }

  /* Tuning panel */
  .panel {
    width: min(1280px, 100%);
    display: grid; grid-template-columns: 3fr 3fr 3fr 2fr; align-items: start;
    gap: 16px 32px;
    padding-top: 14px;
    border-top: 3px solid var(--ink);
    background: var(--ground);
  }
  .group { display: grid; gap: 10px; min-width: 0; }
  .panel .actions { grid-column: 1 / -1; }
  .group.glow .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .panel { grid-template-columns: 1fr 1fr; } }
  .group h2 {
    margin: 0; display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .group h2::before { content: ""; width: 10px; height: 10px; background: var(--swatch); }
  .group.light { --swatch: var(--red); }
  .group.ripple { --swatch: var(--blue); }
  .group.wave { --swatch: var(--yellow); --edge: var(--ink); }
  .group.glow { --swatch: var(--ink); }
  .sliders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field-head {
    display: grid; gap: 2px;
    font-size: 13px; font-weight: 500;
  }
  .field-head output {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .field-scale {
    display: flex; justify-content: space-between; gap: 6px;
    font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--ink); }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--ink); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; margin-top: -6px; border: 0; border-radius: 0;
    background: var(--swatch); box-shadow: 0 0 0 1px var(--edge, transparent);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 0; background: var(--swatch);
    box-shadow: 0 0 0 1px var(--edge, transparent);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .actions label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; margin-right: 6px;
  }
  .actions input[type="checkbox"] { accent-color: var(--blue); width: 14px; height: 14px; margin: 0; }
  .actions button {
    font: 700 11px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase;
    padding: 10px 14px; border: 2px solid var(--ink); border-radius: 0;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .actions button.primary { background: var(--ink); color: var(--ground); }
  .actions button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .actions .status { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  @media (max-width: 760px) {
    .panel { grid-template-columns: 1fr; }
    body { overflow: auto; }
    .stage { height: auto; min-height: 100%; grid-template-rows: auto auto; }
    .phone-slot { height: auto; }
    .phone { height: auto; width: min(390px, 100%); }
    .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .caption, .shape.half, .shape.square { display: none; }
    .shape.circle { width: 70vw; height: 70vw; left: -24vw; top: -10vw; }
    .shape.bar { width: 100%; top: 72%; }
  }
</style>

<main class="stage">
  <div class="shape circle" aria-hidden="true"></div>
  <div class="shape half" aria-hidden="true"></div>
  <div class="shape bar" aria-hidden="true"></div>
  <div class="shape square" aria-hidden="true"></div>

  <div class="phone-slot">
  <div class="phone">
    <div class="screen" id="screen" tabindex="0" role="button"
         aria-label="Press and hold to move through the colours. Let go when the colour matches how you feel.">
      <canvas id="view" aria-hidden="true"></canvas>
      <div class="header">
        <h1 class="question">How do you feel today?</h1>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <div class="timer" id="timer">
        <svg viewBox="-30 -30 60 60" aria-hidden="true">
          <defs>
            <radialGradient id="soft-fill">
              <stop offset="0" style="stop-color: var(--arc, #fff); stop-opacity: 0.75"></stop>
              <stop offset="0.7" style="stop-color: var(--arc, #fff); stop-opacity: 0.35"></stop>
              <stop offset="1" style="stop-color: var(--arc, #fff); stop-opacity: 0.12"></stop>
            </radialGradient>
          </defs>
          <circle class="fill" r="22.5" fill="url(#soft-fill)"></circle>
          <circle class="track" r="24"></circle>
          <circle class="arc" id="arc" r="24"></circle>
          <g id="ticks"></g>
          <text class="loop-num" id="loop-num" x="0" y="0"></text>
        </svg>
        <span class="hint" id="hint">Press and hold</span>
        <button type="button" class="again" id="again" hidden>Try again</button>
      </div>
      <div class="fallback" id="fallback" hidden>This display needs WebGL. Try a recent version of Chrome, Safari or Firefox.</div>
    </div>
  </div>
  </div>

  <section class="panel" aria-label="Tune the display">
    <div class="group wave">
      <h2>Colour wave</h2>
      <div class="sliders" id="sliders-wave"></div>
    </div>
    <div class="group light">
      <h2>Light and pulse</h2>
      <div class="sliders" id="sliders-light"></div>
    </div>
    <div class="group ripple">
      <h2>Ripple</h2>
      <div class="sliders" id="sliders-ripple"></div>
    </div>
    <div class="group glow">
      <h2>Glow</h2>
      <div class="sliders" id="sliders-glow"></div>
    </div>
    <div class="actions">
      <label for="follow"><input type="checkbox" id="follow"> Ripple swells with pulse</label>
      <button type="button" id="reset">Reset</button>
      <button type="button" class="primary" id="copy">Copy values</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </section>

  <aside class="caption">
    <h2>Halvorsen attractor</h2>
    <p id="spec">a = 1.4 · 200,000 points</p>
    <p class="choice" id="choice" hidden><i></i><span></span></p>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>

<script>
// Every tunable lives here. The slider panel reads and writes this object live.
const CONFIG = {
  attractor: {
    a: 1.4,           // Halvorsen parameter (1.4 is chaotic; ~1.89 collapses to a single loop)
    points: 200000,   // trajectory samples
    dt: 0.004,        // integration step
    fill: 1.15,       // shape radius vs half the screen width (the outer tips may reach the edge)
    pointSize: 2.0,   // CSS px
    brightness: 0.07, // per-point light; points add up where they overlap
    spin: 0.05,       // rad/s around the symmetry axis
    tilt: 0.22,       // rad, leans the symmetry axis away from the camera
    sway: 0.12,       // rad, slow wobble on top of the tilt
  },
  color: {
    // OKLCH stops in order. Hues are unwrapped (25 -> 385 ...) so the cycle always turns the same way.
    stops: [
      { name: "green",  l: 0.88, c: 0.10, h: 145 }, // idle colour
      { name: "blue",   l: 0.72, c: 0.14, h: 250 },
      { name: "purple", l: 0.68, c: 0.17, h: 305 },
      { name: "red",    l: 0.64, c: 0.21, h: 385 },
      { name: "orange", l: 0.78, c: 0.16, h: 415 },
      { name: "yellow", l: 0.91, c: 0.17, h: 455 },
      { name: "green",  l: 0.88, c: 0.10, h: 505 },
    ],
    loop: 5,          // seconds for one full trip round the wheel
    dwell: 0.15,      // share of each segment spent resting on the pure stop
    lag: 0.35,        // seconds the top of the shape trails the bottom
    band: 0.6,        // extra light on the wave front while colours change
    flare: 0.9,       // brightness kick when a colour locks in
    resetTime: 0.8,   // seconds to fade back to green on "Try again"
  },
  pulse: {
    perMinute: 12,    // breaths per minute
    depth: 0.16,      // 0..1 brightness swing
    glowFollows: true,
    glowSwing: 0.25,  // 0..1 bloom swing when glowFollows is on
    holdSpeedup: 1.5, // breath quickens while the screen is held
  },
  ripple: {
    amplitude: 0.035, // displacement as a share of the shape's radius
    waves: 2,         // crests between the centre and the outer edge
    period: 12,       // seconds for one crest to travel outward
    glow: 0.3,        // extra light riding on each crest
    followsBreath: true, // ripple swells with the pulse
  },
  glow: { strength: 1.0, radius: 0.6, threshold: 0.05 },
  button: { glow: 0.6 }, // strength of the soft colour fill inside the timer ring (0..1)
};

// OKLCH -> gamma-encoded sRGB (0..1), clamped.
function oklchToRgb({ l, c, h }) {
  const hr = (h * Math.PI) / 180;
  const a = c * Math.cos(hr), b = c * Math.sin(hr);
  const l_ = l + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = l - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = l - 0.0894841775 * a - 1.2914855480 * b;
  const L = l_ ** 3, M = m_ ** 3, S = s_ ** 3;
  const lin = [
     4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S,
    -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S,
    -0.0041960863 * L - 0.7034186147 * M + 1.7076147010 * S,
  ];
  return lin.map((v) => {
    v = Math.min(1, Math.max(0, v));
    return v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055;
  });
}

// Colour at a given hold time. Mirrors paletteAt() in the vertex shader.
function paletteAt(time) {
  const C = CONFIG.color, S = C.stops;
  const n = S.length - 1;
  const s = (((time / C.loop) % 1) + 1) % 1 * n;
  const i = Math.min(Math.floor(s), n - 1), f = s - i;
  const g = Math.min(1, Math.max(0, (f - C.dwell) / Math.max(1 - C.dwell, 0.001)));
  const e = g * g * (3 - 2 * g);
  const lch = { l: S[i].l + (S[i + 1].l - S[i].l) * e, c: S[i].c + (S[i + 1].c - S[i].c) * e, h: S[i].h + (S[i + 1].h - S[i].h) * e };
  return { lch: { l: lch.l, c: lch.c, h: ((lch.h % 360) + 360) % 360 }, rgb: oklchToRgb(lch) };
}
const toHex = (rgb) => "#" + rgb.map((v) => Math.round(v * 255).toString(16).padStart(2, "0")).join("");

// Halvorsen system, integrated with RK4.
function buildHalvorsen({ a, points, dt }) {
  const f = (x, y, z) => [
    -a * x - 4 * y - 4 * z - y * y,
    -a * y - 4 * z - 4 * x - z * z,
    -a * z - 4 * x - 4 * y - x * x,
  ];
  let x = -1.48, y = -1.51, z = 2.04;
  const step = () => {
    const k1 = f(x, y, z);
    const k2 = f(x + k1[0] * dt / 2, y + k1[1] * dt / 2, z + k1[2] * dt / 2);
    const k3 = f(x + k2[0] * dt / 2, y + k2[1] * dt / 2, z + k2[2] * dt / 2);
    const k4 = f(x + k3[0] * dt, y + k3[1] * dt, z + k3[2] * dt);
    x += (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    y += (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    z += (dt / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
  };
  for (let i = 0; i < 3000; i++) step(); // settle onto the attractor

  const pos = new Float32Array(points * 3);
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < points; i++) {
    step();
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    cx += x; cy += y; cz += z;
  }
  cx /= points; cy /= points; cz /= points;

  // Centre it, then point the (1,1,1) symmetry axis at the camera so the three lobes show.
  const q = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(1, 1, 1).normalize(), new THREE.Vector3(0, 0, 1));
  const v = new THREE.Vector3();
  const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < points; i++) {
    v.set(pos[i * 3] - cx, pos[i * 3 + 1] - cy, pos[i * 3 + 2] - cz).applyQuaternion(q);
    pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
    for (let j = 0; j < 3; j++) { min[j] = Math.min(min[j], v.getComponent(j)); max[j] = Math.max(max[j], v.getComponent(j)); }
  }
  // Re-centre on the bounding box so the shape sits in the middle of the screen.
  const mid = [0, 1, 2].map((j) => (min[j] + max[j]) / 2);
  let radius = 0;
  for (let i = 0; i < points; i++) {
    for (let j = 0; j < 3; j++) pos[i * 3 + j] -= mid[j];
    radius = Math.max(radius, Math.hypot(pos[i * 3], pos[i * 3 + 1]));
  }
  return { pos, radius };
}

(function start() {
  const screen = document.getElementById("screen");
  const canvas = document.getElementById("view");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Timer ring ticks: one per colour stop (six segments).
  const ticks = document.getElementById("ticks");
  for (let i = 0; i < 6; i++) {
    const t = (i / 6) * Math.PI * 2 - Math.PI / 2;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("class", "tick");
    line.setAttribute("x1", (Math.cos(t) * 21).toFixed(2));
    line.setAttribute("y1", (Math.sin(t) * 21).toFixed(2));
    line.setAttribute("x2", (Math.cos(t) * 27).toFixed(2));
    line.setAttribute("y2", (Math.sin(t) * 27).toFixed(2));
    ticks.appendChild(line);
  }

  if (!window.THREE) { document.getElementById("fallback").hidden = false; return; }
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
  } catch (e) {
    document.getElementById("fallback").hidden = false;
    return;
  }
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
  camera.position.set(0, 0, 40);

  const A = CONFIG.attractor;
  const { pos, radius } = buildHalvorsen(A);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uIntensity: { value: A.brightness },
      uStops: { value: CONFIG.color.stops.map((s) => new THREE.Vector3(s.l, s.c, s.h)) },
      uLoop: { value: 5 },
      uDwell: { value: 0.15 },
      uHold: { value: 0 },
      uLock: { value: 1e6 },
      uLag: { value: 0.35 },
      uBand: { value: 0.6 },
      uResetMix: { value: 0 },
      uSize: { value: A.pointSize },
      uPixelRatio: { value: 1 },
      uRadius: { value: radius },
      uObjRadius: { value: radius },
      uRipplePhase: { value: 0 },
      uRippleAmp: { value: 0 },
      uRippleWaves: { value: 3 },
      uRippleGlow: { value: 0 },
    },
    vertexShader: `
      uniform float uSize, uPixelRatio, uRadius, uObjRadius;
      uniform float uRippleAmp, uRippleWaves, uRipplePhase, uRippleGlow;
      uniform vec3 uStops[7];
      uniform float uLoop, uDwell, uHold, uLock, uLag, uBand, uResetMix;
      varying float vShade;
      varying vec3 vColor;

      vec3 oklchToSrgb(vec3 lch) {
        float h = radians(lch.z);
        float a = lch.y * cos(h), b = lch.y * sin(h);
        float l_ = lch.x + 0.3963377774 * a + 0.2158037573 * b;
        float m_ = lch.x - 0.1055613458 * a - 0.0638541728 * b;
        float s_ = lch.x - 0.0894841775 * a - 1.2914855480 * b;
        float L = l_ * l_ * l_, M = m_ * m_ * m_, S = s_ * s_ * s_;
        vec3 lin = clamp(vec3(
           4.0767416621 * L - 3.3077115913 * M + 0.2309699292 * S,
          -1.2684380046 * L + 2.6097574011 * M - 0.3413193965 * S,
          -0.0041960863 * L - 0.7034186147 * M + 1.7076147010 * S), 0.0, 1.0);
        vec3 lo = lin * 12.92;
        vec3 hi = 1.055 * pow(lin, vec3(1.0 / 2.4)) - 0.055;
        return mix(lo, hi, step(vec3(0.0031308), lin));
      }

      void main() {
        // Ripple: concentric waves travel outward from the centre, pushing the strands
        // in and out (and slightly toward the viewer) so the lines undulate.
        float r = length(position.xy);
        float phase = 6.2831853 * (uRippleWaves * r / uObjRadius) - uRipplePhase;
        float wave = sin(phase);
        vec2 dir = r > 0.0001 ? position.xy / r : vec2(0.0);
        vec3 p = position;
        p.xy += dir * wave * uRippleAmp * uObjRadius;
        p.z += cos(phase) * uRippleAmp * uObjRadius * 0.6;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * uPixelRatio;
        // Points nearer the camera read slightly brighter, which gives the cloud depth.
        float depth = clamp((mv.z + 40.0) / (uRadius * 1.0), -1.0, 1.0);

        // Colour wave: each point reads the cycle at (hold time - lag x height), so new
        // colours enter at the bottom and rise. Points stop at the locked time on release.
        float height = clamp(0.5 + mv.y / (2.0 * uRadius), 0.0, 1.0);
        float tp = max(min(uHold - uLag * height, uLock), 0.0);
        float s = fract(tp / uLoop) * 6.0;
        float i = min(floor(s), 5.0);
        float f = s - i;
        float g = clamp((f - uDwell) / max(1.0 - uDwell, 0.001), 0.0, 1.0);
        float e = g * g * (3.0 - 2.0 * g);
        int ii = int(i);
        vec3 lch = mix(uStops[ii], uStops[ii + 1], e);
        vColor = mix(oklchToSrgb(lch), oklchToSrgb(uStops[0]), uResetMix);

        // Bright band: strongest where a point is mid-way between two colours.
        float moving = tp < uLock - 0.0001 ? 1.0 : 0.0;
        float band = 4.0 * g * (1.0 - g) * moving * step(0.0001, tp);

        vShade = (0.7 + 0.3 * depth) * (1.0 + uRippleGlow * wave) * (1.0 + uBand * band);
      }`,
    fragmentShader: `
      uniform float uIntensity;
      varying float vShade;
      varying vec3 vColor;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float soft = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor * uIntensity * vShade * soft, 1.0);
      }`,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false,
    transparent: true,
  });

  const cloud = new THREE.Points(geometry, material);
  const holder = new THREE.Group();
  holder.add(cloud);
  scene.add(holder);

  let composer = null, bloom = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256),
      CONFIG.glow.strength, CONFIG.glow.radius, CONFIG.glow.threshold);
    composer.addPass(bloom);
  }

  function resize() {
    const w = screen.clientWidth, h = screen.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    if (composer) { composer.setPixelRatio(dpr); composer.setSize(w, h); }
    material.uniforms.uPixelRatio.value = dpr;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Scale so the shape spans `fill` of the screen width at the camera's focal plane.
    const visibleH = 2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360);
    const visibleW = visibleH * camera.aspect;
    const s = (A.fill * visibleW) / (2 * radius);
    holder.scale.setScalar(s);
    material.uniforms.uRadius.value = radius * s;
  }
  new ResizeObserver(resize).observe(screen);
  resize();

  // ---- Press / release ----
  // idle -> holding (press) -> settling (released; the top catches up) -> locked -> resetting -> idle
  const timer = document.getElementById("timer");
  const arc = document.getElementById("arc");
  const loopNum = document.getElementById("loop-num");
  const hint = document.getElementById("hint");
  const again = document.getElementById("again");
  const choice = document.getElementById("choice");
  const ARC_LEN = 2 * Math.PI * 24;
  let state = "idle", holdT = 0, lockT = Infinity, flare = 0, resetMix = 0;

  function press() {
    if (state !== "idle") return;
    state = "holding"; holdT = 0; lockT = Infinity;
    timer.classList.add("pressing");
    timer.style.setProperty("--arc", toHex(paletteAt(0).rgb));
    hint.textContent = "Let go to choose";
  }
  function release() {
    if (state !== "holding") return;
    state = "settling"; lockT = holdT;
    timer.classList.remove("pressing");
    timer.classList.add("chosen");
  }
  function lockIn() {
    state = "locked"; flare = 1;
    screen.classList.add("locked");
    timer.classList.remove("locked"); void timer.offsetWidth; timer.classList.add("locked");
    hint.hidden = true; again.hidden = false;
    const { lch, rgb } = paletteAt(lockT);
    const hex = toHex(rgb);
    choice.hidden = false;
    choice.style.setProperty("--chosen", hex);
    choice.querySelector("span").textContent =
      `Last choice ${hex} · held ${lockT.toFixed(1)} s`;
    screen.dispatchEvent(new CustomEvent("mood:chosen", { bubbles: true, detail: {
      hex, oklch: { l: +lch.l.toFixed(3), c: +lch.c.toFixed(3), h: +lch.h.toFixed(1) },
      holdMs: Math.round(lockT * 1000), loops: Math.floor(lockT / CONFIG.color.loop) + 1,
      at: new Date().toISOString(),
    } }));
  }
  function tryAgain() {
    if (state !== "locked") return;
    state = "resetting"; resetMix = 0;
    timer.classList.remove("chosen");
    again.hidden = true; hint.hidden = false; hint.textContent = "Press and hold";
    screen.classList.remove("locked"); timer.classList.remove("locked");
    screen.focus({ preventScroll: true });
  }

  screen.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target === again) return;
    if (state !== "idle") return;
    screen.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    press();
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    screen.addEventListener(type, release);
  }
  screen.addEventListener("contextmenu", (e) => e.preventDefault());
  screen.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && e.target === screen) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  screen.addEventListener("keyup", (e) => {
    if ((e.key === " " || e.key === "Enter") && e.target === screen) release();
  });
  again.addEventListener("click", tryAgain);
  again.addEventListener("pointerdown", (e) => e.stopPropagation());

  // Drop to half the points if the device can't hold ~40fps.
  let frames = 0, sampleStart = 0, reduced = false, pointBoost = 1;

  // Phases are accumulated per frame, so moving a speed slider never makes the motion jump.
  let breathPhase = 0, ripplePhase = 0;
  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = clock.elapsedTime;
    const P = CONFIG.pulse;

    const C = CONFIG.color;
    const u = material.uniforms;

    // Advance the colour clock. After release it keeps running for `lag` seconds so the
    // top of the shape catches up to the locked colour, then the flare fires.
    if (state === "holding" || state === "settling") holdT += dt;
    if (state === "settling" && holdT >= lockT + C.lag) lockIn();
    if (state === "resetting") {
      resetMix = Math.min(1, resetMix + dt / C.resetTime);
      if (resetMix >= 1) { state = "idle"; holdT = 0; lockT = Infinity; resetMix = 0; }
    }
    flare *= Math.exp(-dt / 0.6);

    u.uLoop.value = C.loop;
    u.uDwell.value = C.dwell;
    u.uLag.value = C.lag;
    u.uBand.value = C.band;
    u.uHold.value = holdT;
    u.uLock.value = Number.isFinite(lockT) ? lockT : 1e6;
    u.uResetMix.value = resetMix;
    C.stops.forEach((st, i) => u.uStops.value[i].set(st.l, st.c, st.h));

    // Timer ring: one clockwise sweep per loop, drawn in the leading colour.
    const shown = Math.min(holdT, lockT);
    if (state === "idle" || state === "resetting") {
      arc.style.strokeDashoffset = ARC_LEN;
      loopNum.textContent = "";
    } else {
      const progress = (shown % C.loop) / C.loop;
      arc.style.strokeDashoffset = ARC_LEN * (1 - progress);
      timer.style.setProperty("--arc", toHex(paletteAt(shown).rgb));
      const loop = Math.floor(shown / C.loop) + 1;
      loopNum.textContent = loop > 1 ? loop : "";
    }

    // Breath: 0..1, smooth sine at `perMinute` (quicker while held).
    const busy = state === "holding" || state === "settling";
    breathPhase += dt * (P.perMinute / 60) * (busy ? P.holdSpeedup : 1);
    const breath = 0.5 - 0.5 * Math.cos(2 * Math.PI * breathPhase);
    const depth = reduceMotion ? P.depth * 0.5 : P.depth;
    u.uIntensity.value = A.brightness * pointBoost * (1 - depth + depth * breath * 2) * (1 + C.flare * flare);
    if (bloom) {
      const swing = P.glowFollows ? P.glowSwing : 0;
      bloom.strength = CONFIG.glow.strength * (1 - swing + swing * breath * 2) * (1 + 0.8 * C.flare * flare);
      bloom.radius = CONFIG.glow.radius;
    }

    const R = CONFIG.ripple;
    const motion = reduceMotion ? 0.25 : 1;
    ripplePhase += dt * motion * (2 * Math.PI) / R.period;
    u.uRipplePhase.value = ripplePhase;
    u.uRippleAmp.value = R.amplitude * (R.followsBreath ? 0.55 + 0.45 * breath * 2 : 1) * motion;
    u.uRippleWaves.value = R.waves;
    u.uRippleGlow.value = R.glow;

    cloud.rotation.z = t * A.spin * motion;
    holder.rotation.x = A.tilt + A.sway * Math.sin(t * 0.11 * motion);
    holder.rotation.y = A.sway * Math.cos(t * 0.07 * motion);

    if (composer) composer.render(); else renderer.render(scene, camera);

    if (!reduced) {
      frames++;
      if (frames === 30) sampleStart = performance.now();
      if (frames === 120) {
        const ms = (performance.now() - sampleStart) / 90;
        if (ms > 25) {
          reduced = true;
          geometry.setDrawRange(0, Math.floor(A.points / 2));
          pointBoost = 2;
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// Tuning panel: each slider runs from its lowest setting (left) to its highest (right)
// and writes straight into CONFIG, which the render loop reads every frame.
(function panel() {
  const fmtPct = (v) => `${Math.round(v * 100)}%`;
  const SLIDERS = [
    { id: "loop-length", group: "wave", label: "Loop length", min: 2, max: 15, step: 0.5,
      get: () => CONFIG.color.loop, set: (v) => (CONFIG.color.loop = v),
      show: (v) => `${v} s`, low: "Short", high: "Long" },
    { id: "wave-lag", group: "wave", label: "Wave lag", min: 0, max: 1, step: 0.05,
      get: () => CONFIG.color.lag, set: (v) => (CONFIG.color.lag = v),
      show: (v) => `${v.toFixed(2)} s`, low: "Short", high: "Long" },
    { id: "wave-light", group: "wave", label: "Wave light", min: 0, max: 1.5, step: 0.05,
      get: () => CONFIG.color.band, set: (v) => (CONFIG.color.band = v),
      show: (v) => `+${Math.round(v * 100)}%`, low: "None", high: "Strong" },
    { id: "brightness", group: "light", label: "Brightness", min: 0.02, max: 0.16, step: 0.005,
      get: () => CONFIG.attractor.brightness, set: (v) => (CONFIG.attractor.brightness = v),
      show: (v) => `${Math.round((v / 0.07) * 100)}%`, low: "Dim", high: "Bright" },
    { id: "pulse-depth", group: "light", label: "Pulse depth", min: 0, max: 0.6, step: 0.01,
      get: () => CONFIG.pulse.depth, set: (v) => (CONFIG.pulse.depth = v),
      show: (v) => `±${fmtPct(v)}`, low: "Steady", high: "Strong" },
    { id: "pulse-speed", group: "light", label: "Pulse speed", min: 3, max: 30, step: 1,
      get: () => CONFIG.pulse.perMinute, set: (v) => (CONFIG.pulse.perMinute = v),
      show: (v) => `${v}/min`, low: "Slow", high: "Fast" },
    { id: "wave-speed", group: "ripple", label: "Wave speed", min: 1, max: 30, step: 0.5,
      get: () => 60 / CONFIG.ripple.period, set: (v) => (CONFIG.ripple.period = 60 / v),
      show: (v) => `${+(60 / v).toFixed(1)} s`, low: "Slow", high: "Fast" },
    { id: "wave-count", group: "ripple", label: "Waves", min: 1, max: 6, step: 0.5,
      get: () => CONFIG.ripple.waves, set: (v) => (CONFIG.ripple.waves = v),
      show: (v) => `${v}`, low: "Long", high: "Tight" },
    { id: "bend", group: "ripple", label: "Bend", min: 0, max: 0.1, step: 0.0025,
      get: () => CONFIG.ripple.amplitude, set: (v) => (CONFIG.ripple.amplitude = v),
      show: (v) => `${(v * 100).toFixed(1)}%`, low: "Flat", high: "Deep" },
    { id: "shape-glow", group: "glow", label: "Shape glow", min: 0, max: 2.5, step: 0.05,
      get: () => CONFIG.glow.strength, set: (v) => (CONFIG.glow.strength = v),
      show: (v) => `${Math.round(v * 100)}%`, low: "None", high: "Strong" },
    { id: "button-glow", group: "glow", label: "Button glow", min: 0, max: 1, step: 0.05,
      get: () => CONFIG.button.glow,
      set: (v) => { CONFIG.button.glow = v; document.getElementById("timer").style.setProperty("--fill-strength", v); },
      show: (v) => `${Math.round(v * 100)}%`, low: "None", high: "Strong" },
  ];
  const STORE = "hdyf-tuning-v2";
  const defaults = Object.fromEntries(SLIDERS.map((s) => [s.id, s.get()]));
  defaults.follow = CONFIG.ripple.followsBreath;

  const inputs = {};
  for (const s of SLIDERS) {
    const field = document.createElement("div");
    field.className = "field";
    field.innerHTML = `
      <div class="field-head"><label for="${s.id}">${s.label}</label><output for="${s.id}"></output></div>
      <input type="range" id="${s.id}" min="${s.min}" max="${s.max}" step="${s.step}">
      <div class="field-scale" aria-hidden="true"><span>${s.low}</span><span>${s.high}</span></div>`;
    document.getElementById(`sliders-${s.group}`).appendChild(field);
    const input = field.querySelector("input");
    const out = field.querySelector("output");
    const sync = () => { const v = parseFloat(input.value); s.set(v); out.textContent = s.show(v); };
    input.addEventListener("input", () => { sync(); save(); });
    inputs[s.id] = { input, sync };
  }
  const follow = document.getElementById("follow");
  follow.addEventListener("change", () => { CONFIG.ripple.followsBreath = follow.checked; save(); });

  function apply(values) {
    for (const s of SLIDERS) {
      if (typeof values[s.id] === "number") inputs[s.id].input.value = values[s.id];
      inputs[s.id].sync();
    }
    follow.checked = values.follow ?? defaults.follow;
    CONFIG.ripple.followsBreath = follow.checked;
  }
  function current() {
    const v = Object.fromEntries(SLIDERS.map((s) => [s.id, parseFloat(inputs[s.id].input.value)]));
    v.follow = follow.checked;
    return v;
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(current())); } catch (e) {} }
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; } catch (e) {}
  apply({ ...defaults, ...saved });

  const status = document.getElementById("status");
  const say = (msg) => { status.textContent = msg; clearTimeout(say.t); say.t = setTimeout(() => (status.textContent = ""), 2500); };

  document.getElementById("reset").addEventListener("click", () => {
    apply(defaults); save(); say("Back to defaults");
  });
  document.getElementById("copy").addEventListener("click", () => {
    const text = JSON.stringify({
      glow: { strength: CONFIG.glow.strength }, button: { glow: CONFIG.button.glow },
      color: { loop: CONFIG.color.loop, lag: CONFIG.color.lag, band: CONFIG.color.band },
      attractor: { brightness: CONFIG.attractor.brightness },
      pulse: { perMinute: CONFIG.pulse.perMinute, depth: CONFIG.pulse.depth },
      ripple: {
        period: +CONFIG.ripple.period.toFixed(2), waves: CONFIG.ripple.waves,
        amplitude: CONFIG.ripple.amplitude, followsBreath: CONFIG.ripple.followsBreath,
      },
    }, null, 2);
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      say("Press Ctrl+C / ⌘C to copy");
      setTimeout(() => ta.remove(), 8000);
    };
    try {
      navigator.clipboard.writeText(text).then(() => say("Copied. Paste it to Claude"), fallback);
    } catch (e) { fallback(); }
  });
})();
</script>
